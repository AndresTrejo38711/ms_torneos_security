spring.application.name=ms_torneos_security
server.port=8181
spring.datasource.url=jdbc:mysql://localhost:3306/torneos_security_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave con la que el servidor firma los JWT (mínimo 32 caracteres).
# Viene de una variable de entorno: nunca debe quedar escrita en el repositorio.
security.jwt.secret=${JWT_SECRET}

# Duración de cada sesión (HU-SE-08).
security.session.duration=30m

# Vigencia del código de verificación en dos pasos (HU-SE-10).
security.two-factor.code-duration=5m

# Microservicio de notificaciones (emails_google): envía los correos con los códigos.
notifications.url=http://localhost:5000

# Administrador inicial: DatabaseSeeder lo crea al arrancar si no existe.
# Igual que las claves anteriores, viene de variables de entorno.
security.admin.email=${ADMIN_EMAIL}
security.admin.password=${ADMIN_PASSWORD}

# Login con Google, GitHub y Microsoft (HU-SE-08). Las credenciales de cada proveedor
# también vienen de variables de entorno. En cada proveedor se registra como URL de retorno
# http://localhost:8181/login/oauth2/code/google (o /github, /microsoft).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# user:email permite leer el correo aunque el usuario no lo tenga público en GitHub.
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Microsoft no viene preconfigurado en Spring: se indican sus direcciones.
# "common" acepta cuentas personales (Outlook, Hotmail) y de organizaciones.
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# Página del front que recibe el token al terminar el login con un proveedor.
# Vacía: el backend responde el mismo JSON que /api/auth/login (sirve para probar sin front).
security.oauth2.redirect-uri=

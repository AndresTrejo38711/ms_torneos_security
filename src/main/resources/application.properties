spring.application.name=ms_torneos_security
server.port=8181
spring.datasource.url=jdbc:mysql://localhost:3306/torneos_security_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave con la que el servidor firma los JWT (mínimo 32 caracteres).
# Viene de una variable de entorno: nunca debe quedar escrita en el repositorio.
security.jwt.secret=${JWT_SECRET}

# Duración de cada sesión (HU-SE-08).
security.session.duration=30m
